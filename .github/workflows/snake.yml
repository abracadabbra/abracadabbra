name: Generate Snake Animation

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: abracadabbra
          outputs: |
            dist/github-contribution-grid-snake-dark.svg?color_snake=green&color_dots=#bfdadc,#6e40c9,#9e40c9,#c940c9,#c9406e,#4076c9

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
